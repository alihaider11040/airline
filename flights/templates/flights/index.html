{% extends "flights/layout.html" %}

{% block body %}
<h1>Flights</h1>
<ul>
    {% for flight in flights %}
    <li>
        <a href="{% url 'flight' flight.id %}">
            Flight {{ flight.id }}: {{ flight.origin.code }} &rarr; {{ flight.destination.code }}
        </a>
        ({{ flight.duration }} minutes)
    </li>
    {% empty %}
    <li>No flights available.</li>
    {% endfor %}
</ul>
{% endblock %}
